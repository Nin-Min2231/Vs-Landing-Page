name = "vs-landing-page"
compatibility_date = "2026-07-30"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
# run_worker_first = true (2026-09, T1 kế hoạch SEO): mặc định Cloudflare phục vụ file tĩnh khớp
# đường dẫn (vd "/" -> index.html) THẲNG từ edge, bỏ qua hẳn worker.js/fetch() — phát hiện lúc test
# redirect 301 workers.dev->topvisa5s.com: request tới "/" trên workers.dev vẫn trả 200 trang chủ
# bình thường, không bao giờ chạm được đoạn code redirect. Bật cờ này để MỌI request (kể cả trang
# tĩnh) luôn chạy qua worker.js trước — bắt buộc để redirect hoạt động, và cũng cần cho các route
# động sau này (T4 /blog, T14 /visa-<slug>) hoạt động đúng trên mọi hostname.
run_worker_first = true

# Chạy job nền cứ mỗi 10 phút: quét ho_so/leads sinh thông báo (Trả kết quả hôm nay / Nhắc tư vấn
# hôm nay / Khách đăng ký mới) + gửi Web Push cho các thiết bị đã bật thông báo đẩy trong admin.html.
# Xem 02_Source/worker.js + CLAUDE.md mục 33. Cần 2 secret bắt buộc (set qua Cloudflare Dashboard,
# KHÔNG bao giờ đặt trong file này/git): SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY_JWK
# (+ VAPID_SUBJECT tùy chọn). VAPID_PUBLIC_KEY hardcode thẳng trong worker.js vì khóa CÔNG KHAI.
[triggers]
crons = ["*/10 * * * *"]

# Workers AI binding (Chat Box Release 1, 08_Chatbox/) — cho phép worker.js gọi env.AI.run(...) để
# trả lời câu hỏi Visa. KHÔNG cần API key dạng chuỗi (khác OpenAI/Gemini) — Cloudflare tự cấp quyền
# theo tài khoản đang deploy Worker này, dùng luôn được ở tầng Free (10.000 neuron/ngày). Cú pháp
# xác nhận lại 2026-08-28 theo tài liệu chính thức Cloudflare Workers AI tại thời điểm code (có thể
# đã đổi so với các lần deploy trước, xem 01_Docs/08_Ban_giao_Claude_Code.md mục 3).
[ai]
binding = "AI"
